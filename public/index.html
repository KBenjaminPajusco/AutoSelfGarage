<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d86a12">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Auto Self Garage</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23b3141b'/><path d='M3 10l1.5-4h7L13 10v2H3z' fill='%23fff'/><circle cx='5' cy='12' r='1.3' fill='%23222'/><circle cx='11' cy='12' r='1.3' fill='%23222'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Saira+Stencil+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/" } }</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="labels"></div>

<header id="brand"><span class="logo">ASG</span><div><b>Auto Self Garage</b><small>SARL RCA · Saint-Herblain</small></div></header>
<nav id="views">
  <button data-view="site" class="on">Site</button>
  <button data-view="atelier">Atelier</button>
  <button data-view="pause">Étage</button>
  <button data-view="parking">Parking</button>
  <button data-view="dessus">Dessus</button>
  <span class="sep"></span>
  <button id="btn-roof" title="Toit de l'atelier : auto / affiché / masqué">Toit : auto</button>
  <button id="btn-q" title="Qualité graphique (basse = téléphone)">Qualité</button>
</nav>
<div id="indicators"></div>
<div id="toast" hidden></div>

<nav id="dock">
  <button data-open="arrivee" class="primary" title="Nouvelle arrivée">➕ <span class="t">Nouvelle arrivée</span><span class="ts">Arrivée</span></button>
  <button data-open="vehicles" title="Véhicules">🚗 <span class="t">Véhicules</span></button>
  <button data-open="clients" title="Clients">👤 <span class="t">Clients</span></button>
  <button data-open="stock" title="Réserve">🗄 <span class="t">Réserve</span></button>
  <button data-open="orders" title="Commandes">📦 <span class="t">Commandes</span></button>
  <button data-open="mechanics" title="Mécanos">🔧 <span class="t">Mécanos</span></button>
  <button data-open="tarifs" title="Tarifs">💶 <span class="t">Tarifs</span></button>
  <button data-open="settings">⚙</button>
</nav>

<dialog id="modal"><div class="m-head"><button class="ghost" id="m-back" title="Retour">←</button><h2 id="m-title"></h2><button class="ghost" id="m-close" title="Fermer (Échap)">✕</button></div><div id="m-body"></div></dialog>

<script type="module" src="app.js"></script>
</body>
</html>
